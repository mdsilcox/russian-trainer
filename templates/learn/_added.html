{% if error %}<span class="error">{{ error }}</span>
{% elif added == 0 and skipped %}<span class="ln-ok">All {{ skipped }} words are already in your cards.</span>
{% else %}<span class="ln-ok">Added {{ added }} {{ "word" if added == 1 else "words" }}{% if skipped %}, skipped {{ skipped }} already in your cards{% endif %}.</span>{% endif %}
